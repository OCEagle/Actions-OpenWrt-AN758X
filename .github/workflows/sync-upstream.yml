name: Sync Upstream

# 目标：让 build-ponwrt.yml 始终与上游一致，本仓库不再维护本地默认值。
# 自定义默认值已迁到 build-040md.yml（上游没有这个文件，merge 不会碰它）。

on:
  schedule:
    - cron: '0 2 * * 1'   # 每周一 02:00 UTC（北京时间 10:00）
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只演练，不提交不推送'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure git and fetch upstream
        run: |
          set -euo pipefail
          git config user.name  'sync-upstream[bot]'
          git config user.email 'sync-upstream@users.noreply.github.com'
          git remote add upstream https://github.com/qwe-qaq/Actions-OpenWrt-AN758X.git
          git fetch --no-tags upstream main

      - name: Merge upstream (upstream wins)
        run: |
          set -euo pipefail
          git merge --no-edit -X theirs upstream/main || { echo '::error::merge 未能自动收敛，需要人工处理'; git status --short; exit 1; }
          git checkout upstream/main -- .github/workflows/build-ponwrt.yml

      - name: Commit and push
        if: inputs.dry_run != 'true'
        run: |
          set -euo pipefail
          git add -A .github/workflows/build-ponwrt.yml
          git diff --cached --quiet || git commit -m 'chore(ci): 对齐上游 [skip ci]'
          if [ -n "$(git log --oneline origin/main..HEAD)" ]; then
            git push origin HEAD:main
          else
            echo '已与上游一致，无需推送'
          fi
